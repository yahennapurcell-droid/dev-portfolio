<!DOCTYPE html>
<!-- The line above tells the browser this is a modern HTML5 page. -->

<!-- <html> wraps the whole page. lang="en" says the page is in English. -->
<html lang="en">

  <!-- <head> holds info ABOUT the page. It doesn't show on the page itself. -->
  <head>
    <!-- charset lets the page show all letters and symbols correctly. -->
    <meta charset="UTF-8">
    <!-- viewport makes the page fit phone screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title> is the text on the browser tab. -->
    <title>Yahenna Purcell | Developer Portfolio</title>
  </head>

  <!-- <body> holds everything you SEE on the page. -->
  <body>

    <!-- <h1> is the biggest heading. Use only one per page. -->
    <h1>Yahenna Purcell</h1>

    <!-- <section> groups related content together. -->
    <section>
      <!-- <h2> is a smaller heading for a section. -->
      <h2>About Me</h2>
      <!-- <p> is a paragraph of text. Replace this with your own story. -->
      <p>About me coming soon.</p>
    </section>

    <section>
      <h2>Projects</h2>
      <p>My projects will go here.</p>
    </section>

  </body>
</html>
